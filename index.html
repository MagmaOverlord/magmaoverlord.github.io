<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    
    <!-- HTML fallback: Redirects after 0 seconds -->
    <meta http-equiv="refresh" content="0; url=https://magmaoverlord.itch.io/">
    
    <!-- JavaScript redirect: Executes immediately -->
    <script>
        window.location.replace("https://magmaoverlord.itch.io/");
    </script>
</head>
<body>
    <!-- Manual fallback for users with JS and meta-refresh disabled -->
    <p>The portfolio is currently under construction. Redirecting to itch page...</p>
    <p>If you are not redirected automatically, <a href="https://magmaoverlord.itch.io/">click here</a>.</p>
</body>
</html>
